services:
  saludo:
    build:
      context: ./saludo
      args:
        JAVA_VERSION: 17
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      args:
        JAVA_VERSION: 21
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SALUDO_URL: http://saludo:8081
    depends_on:
      - saludo